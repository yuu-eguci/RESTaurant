name: Execute commands regularly

# 管理ユーザの Basic 認証で command を POST します。
# 自動の定期実行は行わず、手動実行だけを受け付けます。

on:
  workflow_dispatch:
  # NOTE: GitHub Actions の最短インターバルは5分。
  #       GitHub Actions は全然時間通り動かない。
  # At minute 30 past every hour from 0 through 6 on every day-of-week from Monday through Friday.
  # 30 0-6 * * 1-5
  # schedule:
  #   - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:

  cron-job:
    name: foo
    runs-on: ubuntu-latest

    steps:
      - name: Execute command
        env:
          APP_SERVICE_URL: ${{ secrets.APP_SERVICE_URL }}
          APP_SERVICE_COMMAND_USER: ${{ secrets.APP_SERVICE_COMMAND_USER }}
        run: |
          curl --fail -i -X POST --user "$APP_SERVICE_COMMAND_USER" "$APP_SERVICE_URL/commands/samplecommand/"
