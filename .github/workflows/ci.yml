name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker compose build

      - name: Test in container
        run: docker compose run --rm web uv run pytest

      # README の「パッと実行してみたい」がそのまま動くことを確認します。
      - name: Smoke test
        run: |
          docker compose up -d
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down
