[project]
name = "restaurant"
version = "0.1.0"
description = "Django Rest framework + Azure App Service + MySQL + CI/CD by GitHub Actions = test"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.18",
    "pygments>=2.19",
    "pymysql>=1.1",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.11",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "RESTaurant.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "DJ", "SIM"]
# NOTE: DJ008 (__str__ 必須) は admin を使っていないので対象外にしています。
ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
# NOTE: settings を star import で上書きするのは Django のよくある書き方です。
"RESTaurant/production.py" = ["F403", "F405"]
